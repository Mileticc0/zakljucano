<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobilni pregled — ZAKLJUČANO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#0B0908;color:#EDE3CF;font-family:'IBM Plex Sans',system-ui,sans-serif}*{box-sizing:border-box}a{color:#B8893E}a:hover{color:#D4AE6A}button{font:inherit;color:inherit}</style>
</helmet>
<div style="min-height:100vh;padding:32px clamp(16px,3vw,40px) 60px;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
    <div>
      <div style="font-family:'Special Elite',monospace;font-size:13px;letter-spacing:.16em;color:#B8893E">ZAKLJUČANO · TELEFON 390 × 844</div>
      <h1 style="margin:6px 0 0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(44px,6vw,72px);line-height:.9">Mobilna verzija</h1>
    </div>
    <span style="font-size:14px;color:#B9AE99;max-width:360px">Svaki telefon je prava stranica — skrolujte, kliknite, rezervišite. Izaberite stranice ispod.</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="10">
      <button type="button" onClick="{{ p.pick }}" aria-pressed="{{ p.pressed }}" style="min-height:44px;padding:0 16px;border:1px solid {{ p.border }};border-radius:2px;background:{{ p.bg }};color:{{ p.fg }};font-size:14px;cursor:pointer">{{ p.label }}</button>
    </sc-for>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:40px;justify-content:center">
    <sc-for list="{{ phones }}" as="ph" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div style="position:relative;width:414px;height:868px;padding:12px;border-radius:56px;background:#1D1A17;box-shadow:inset 0 0 0 2px #3A332E, 0 40px 80px rgba(0,0,0,.6)">
          <div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#14110F">
            <iframe src="{{ ph.src }}" title="{{ ph.label }}" style="width:390px;height:844px;border:0;display:block"></iframe>
            <div aria-hidden="true" style="position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;pointer-events:none"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:26px">{{ ph.label }}</span>
          <a href="{{ ph.src }}" target="_blank" rel="noopener" style="font-size:14px">Otvori →</a>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const P = [['index', 'Početna'], ['sobe', 'Sobe'], ['soba-kabina', 'Soba (dosije)'], ['rezervacija', 'Rezervacija'], ['placanje', 'Plaćanje'], ['potvrda', 'Potvrda'], ['vauceri', 'Vaučeri'], ['timbilding', 'Timbilding'], ['rodjendani', 'Rođendani'], ['rang-lista', 'Rang-lista'], ['faq', 'FAQ'], ['kontakt', 'Kontakt']];
class Component extends DCLogic {
  state = { sel: ['index', 'rezervacija', 'soba-kabina'] };
  renderVals() {
    const sel = this.state.sel;
    return {
      pages: P.map(([id, label]) => { const on = sel.includes(id); return { label, pressed: on ? 'true' : 'false', bg: on ? '#B8893E' : 'transparent', fg: on ? '#14110F' : '#EDE3CF', border: on ? '#B8893E' : 'rgba(237,227,207,.25)',
        pick: () => this.setState({ sel: on ? sel.filter(x => x !== id) : [...sel.slice(-2), id] }) }; }),
      phones: sel.map(id => ({ src: id + '.dc.html', label: P.find(p => p[0] === id)[1] }))
    };
  }
}
</script>
</body>
</html>
